const productSearch = document.getElementById("productSearch");

const productResult = document.getElementById("productResult");
const mixResult = document.getElementById("mixResult");
const valueResult = document.getElementById("valueResult");


function populateProducts(filter = "") {

    productSelect.innerHTML =
        '<option value="">-- Select Product --</option>';

    products
        .filter(item =>
            item[0].toLowerCase().includes(filter.toLowerCase())
        )
        .forEach((item, index) => {

            const option = document.createElement("option");

            option.value = index;

            option.textContent = item[0];

            productSelect.appendChild(option);
        });
}


function showResult(index) {

    if (index === "" || index === null) {

        productResult.textContent = "-";
        mixResult.textContent = "-";
        valueResult.textContent = "-";

        return;
    }

    const product = products[index];

    productResult.textContent = product[0];

    mixResult.textContent = product[1];

    valueResult.textContent =
        product[2] !== null
            ? product[2].toLocaleString()
            : "Not Available";
}


productSearch.addEventListener("input", function () {

});


productSelect.addEventListener("change", function () {
